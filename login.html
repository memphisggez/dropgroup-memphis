<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trendy Admin</title>
    <!-- โหลดชุดคำสั่ง Bootstrap 5 และไอคอน -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ส่วนนี้คือการระบายสีและจัดทรง (CSS) */
        body {
            background-color: #131224; /* สีพื้นหลังของทั้งหน้าเว็บ (สีดำเข้ม) */
            color: #ffffff;            /* สีตัวหนังสือหลัก (สีขาว) */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;             /* กำหนดให้ความสูงเต็มจอพอดี */
            display: flex;             /* 3 บรรทัดนี้ใช้สำหรับ ดันกล่องล็อกอินให้อยู่ "ตรงกลางจอ" เป๊ะๆ */
            align-items: center;       
            justify-content: center;   
        }

        .login-card {
            background-color: #1c1b2f; /* สีพื้นหลังของกล่องล็อกอิน */
            border: 1px solid #2a2940; /* สีกรอบของกล่อง */
            border-radius: 15px;       /* ความโค้งมนของมุมกล่อง */
            padding: 40px;             /* ระยะห่างจากขอบกล่องถึงตัวหนังสือด้านใน */
            width: 100%;
            max-width: 400px;          /* กำหนดให้กล่องกว้างสูงสุดไม่เกิน 400px */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* เพิ่มเงาให้กล่องดูลอยขึ้นมา */
        }

        .brand-logo {
            color: #9d4edd;            /* สีม่วงของโลโก้สายฟ้า */
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        /* ตกแต่งช่องกรอกข้อมูล (Input) */
        .form-control {
            background-color: #131224;
            border: 1px solid #2a2940;
            color: #ffffff;
            border-radius: 8px;
            padding: 12px 15px;
        }

        /* เวลาเอาเมาส์ไปคลิกที่ช่องกรอกข้อมูล ให้ขอบเป็นสีม่วง */
        .form-control:focus {
            background-color: #131224;
            color: #ffffff;
            border-color: #9d4edd;
            box-shadow: 0 0 0 0.25rem rgba(157, 78, 221, 0.25);
        }

        /* ตกแต่งปุ่มกดเข้าสู่ระบบ */
        .btn-login {
            background: linear-gradient(90deg, #9d4edd 0%, #7b2cbf 100%); /* ไล่สีม่วง */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px); /* เวลาเอาเมาส์ชี้ ปุ่มจะลอยขึ้นนิดนึง */
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.4);
            color: #ffffff;
        }

        .form-label {
            color: #8b8a9e; /* สีตัวหนังสือคำว่า "ชื่อผู้ใช้" และ "รหัสผ่าน" */
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- เริ่มต้นกล่องล็อกอิน -->
    <div class="login-card">
        
        <!-- โลโก้สายฟ้า -->
        <div class="brand-logo">
            <i class="fa-solid fa-bolt"></i>
        </div>
        <h4 class="text-center mb-4 fw-bold">เข้าสู่ระบบตัวแทน</h4>
        
        <!-- แบบฟอร์มกรอกข้อมูล -->
        <!-- ตรง action="index.html" หมายความว่า พอกดปุ่มเข้าสู่ระบบปุ๊บ ให้วิ่งไปเปิดไฟล์ index.html ทันที -->
        <form action="index.html" method="GET">
            
            <!-- ช่องกรอกชื่อผู้ใช้ -->
            <div class="mb-3">
                <label class="form-label">ชื่อผู้ใช้ หรือ เบอร์โทร</label>
                <input type="text" class="form-control" placeholder="กรอกชื่อผู้ใช้ของคุณ" required>
            </div>
            
            <!-- ช่องกรอกรหัสผ่าน -->
            <div class="mb-3">
                <label class="form-label">รหัสผ่าน</label>
                <input type="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
            </div>
            
            <!-- ปุ่มจดจำฉัน และ ลืมรหัสผ่าน -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.85rem;">จดจำฉันไว้</label>
                </div>
                <a href="#" style="color: #9d4edd; font-size: 0.85rem; text-decoration: none;">ลืมรหัสผ่าน?</a>
            </div>
            
            <!-- ปุ่มเข้าสู่ระบบ -->
            <button type="submit" class="btn btn-login">เข้าสู่ระบบ</button>
            
        </form>

    </div>

</body>
</html>
